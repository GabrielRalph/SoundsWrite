<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sounds Write</title>
    <link rel="icon" href="./Assets/logo-icon.png" type="image/png">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Jost:ital,wght@0,100..900;1,100..900&display=swap');
        body {
            font-family: "Jost", sans-serif;
            background-color: white;
            color: #222;
            margin: 0;
            padding: 2em 1em;
        }

        main {
            max-width: 40em;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .logo {
            display: block;
            width: min(20em, 80%);
            margin-bottom: 2em;
        }
        ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        li + li {
            margin-top: 0.75em;
        }
        a {
            display: block;
            padding: 1em 1.25em;
            border: 1px solid #ddd;
            border-radius: 0.5em;
            color: inherit;
            text-decoration: none;
            font-size: 1.2em;
        }
        a:hover {
            border-color: #888;
            background: #f7f7f7;
        }
        a small {
            display: block;
            color: #777;
            font-size: 0.7em;
        }
    </style>
</head>
<body>
    <main>
        <img src="./Assets/logo-text.png" alt="Sounds Write" class="logo">
        <ul>
            <li><a href="./DecodableLibrary/">Decodable Library</a></li>
            <li><a href="./FourInARow/">Four in a Row</a></li>
            <li><a href="./InitialCodeWordBuilder/">Initial Code Word Builder</a></li>
            <li><a href="./WordWriting/">Word Writing</a></li>
        </ul>
    </main>
</body>
</html>
