<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SoundsWrite</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class = "view-window">
        <div class = "i-bw nav-button next" rightArrow onclick = "document.querySelector('pdf-viewer-3d').move(1)"></div>
        <div class = "i-bw nav-button prev" leftArrow onclick = "document.querySelector('pdf-viewer-3d').move(-1)"></div>
        <pdf-viewer-3d 
            transition-duration = "1000"
            src="./Assets/ExtendedCode/U14.pdf"
            onchange="this.parentNode.toggleAttribute('can-move-left', this.pageSetIndex > 0); this.parentNode.toggleAttribute('can-move-right', this.pageSetIndex < this.numPageSets - 1)"
        ></pdf-viewer-3d>
    </div>
    <script type="module" src="./src/pdf-3d.js"></script>
</body>
</html>
